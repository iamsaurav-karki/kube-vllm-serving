installation:
  enabled: true
  kubernetesProvider: ""
  controlPlaneReplicas: 1
  cni:
    type: Calico
    ipam:
      type: Calico
  calicoNetwork:
    bgp: Disabled
    ipPools:
      - cidr: 192.168.0.0/16
        encapsulation: VXLAN
        natOutgoing: Enabled
        nodeSelector: all()

apiServer:
  enabled: false

goldmane:
  enabled: false

whisker:
  enabled: false

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  parentRefs:
    - name: public
      namespace: edge-system
      sectionName: https
  hostnames:
    - llm.ksaurav.com.np
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: open-webui
          port: 80
      timeouts:
        request: 0s

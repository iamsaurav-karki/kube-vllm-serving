apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-api
  namespace: llm-system
spec:
  parentRefs:
    - name: public
      namespace: edge-system
      sectionName: https
  hostnames:
    - llm.ksaurav.com.np
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: vllm
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-http-to-https
  namespace: edge-system
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - llm.ksaurav.com.np
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

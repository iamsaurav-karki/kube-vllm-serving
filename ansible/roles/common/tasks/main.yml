---
- name: Verify Ubuntu 22.04
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("22.04", "==")
    fail_msg: "This playbook supports Ubuntu 22.04 only."

- name: Install repository and runtime prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - jq
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Persist required kernel modules
  ansible.builtin.template:
    src: kubernetes-modules.conf.j2
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"

- name: Load required kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Persist Kubernetes networking sysctls
  ansible.builtin.template:
    src: kubernetes-sysctl.conf.j2
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply Kubernetes sysctls

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker repository for containerd
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: [jammy]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install pinned containerd
  ansible.builtin.apt:
    name: "containerd.io={{ containerd_package_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Generate containerd default configuration
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Configure containerd with the systemd cgroup driver
  ansible.builtin.copy:
    content: >-
      {{ containerd_default_config.stdout
         | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Hold containerd at the validated version
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

- name: Enable containerd
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started

- name: Flush runtime handlers before Kubernetes installation
  ansible.builtin.meta: flush_handlers

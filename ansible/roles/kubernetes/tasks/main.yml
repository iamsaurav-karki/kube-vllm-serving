---
- name: Install Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Kubernetes package repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/"
    suites: ["/"]
    signed_by: /etc/apt/keyrings/kubernetes.asc
    state: present

- name: Install pinned Kubernetes node packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Hold Kubernetes packages at the validated version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Enable kubelet for kubeadm bootstrap
  ansible.builtin.service:
    name: kubelet
    enabled: true
